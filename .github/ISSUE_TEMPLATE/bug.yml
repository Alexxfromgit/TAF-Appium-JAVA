name: Bug report
description: Something in the framework does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect and what happened instead? Include the error and the relevant part of build/logs.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Suite, command and configuration. Remove any credentials.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      description: Emulator or real device, Android/iOS version, or cloud provider
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Commit/tag, Java version, Appium server and driver versions, OS
