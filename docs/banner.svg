<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="APJ Automation Framework - mobile test automation with Appium, Java and TestNG">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.55" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200"/>
    <path d="M200 0V300M400 0V300M600 0V300M800 0V300M1000 0V300"/>
  </g>

  <!-- phones -->
  <g transform="translate(905 48)">
    <rect x="70" y="18" width="118" height="214" rx="20" fill="#0f172a" stroke="#a78bfa" stroke-width="3" opacity="0.7"/>
    <rect x="0" y="0" width="124" height="226" rx="22" fill="#0f172a" stroke="#c4b5fd" stroke-width="3"/>
    <rect x="10" y="22" width="104" height="180" rx="8" fill="url(#screen)"/>
    <rect x="46" y="9" width="32" height="5" rx="2.5" fill="#475569"/>
    <rect x="22" y="40" width="80" height="10" rx="5" fill="#ffffff" opacity="0.9"/>
    <rect x="22" y="60" width="56" height="8" rx="4" fill="#ffffff" opacity="0.6"/>
    <rect x="22" y="130" width="80" height="22" rx="11" fill="#1e1b4b" opacity="0.85"/>
    <path d="M52 94l10 10 20-22" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="72" y="128" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff">APJ Automation Framework</text>
  <text x="74" y="176" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="26" fill="#ddd6fe">Mobile test automation for Android &amp; iOS apps and mobile web</text>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="600" fill="#ffffff">
    <rect x="74" y="210" width="96" height="34" rx="17" fill="#ffffff" fill-opacity="0.14"/>
    <text x="122" y="233" text-anchor="middle">Appium</text>
    <rect x="182" y="210" width="84" height="34" rx="17" fill="#ffffff" fill-opacity="0.14"/>
    <text x="224" y="233" text-anchor="middle">Java 21</text>
    <rect x="278" y="210" width="90" height="34" rx="17" fill="#ffffff" fill-opacity="0.14"/>
    <text x="323" y="233" text-anchor="middle">TestNG</text>
    <rect x="380" y="210" width="86" height="34" rx="17" fill="#ffffff" fill-opacity="0.14"/>
    <text x="423" y="233" text-anchor="middle">Allure</text>
  </g>
</svg>
