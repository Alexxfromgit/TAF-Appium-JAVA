# Framework configuration. Any key can be overridden with -D<key>=... or an env variable
# (upper case, dots -> underscores, e.g. ANDROID_DEVICE_NAME). -Ddevice=<name> layers devices/<name>.properties on top.

#------------------------------ APPIUM SERVER ------------------------------
# local  - the framework starts Appium itself (needs `appium` installed via npm)
# remote - connect to appium.server.url (running server, grid or cloud)
appium.server.mode=local
appium.server.url=http://127.0.0.1:4723/
appium.port=4723
appium.log.level=info
appium.new.command.timeout=120
# Optional, only needed when Appium cannot be found automatically:
# appium.node.path=C:/Program Files/nodejs/node.exe
# appium.js.path=C:/Users/<you>/AppData/Roaming/npm/node_modules/appium/index.js

#------------------------------ PLATFORM -----------------------------------
# android | ios
platform=android

#------------------------------ ANDROID ------------------------------------
android.device.name=emulator-5554
android.platform.version=13
# android.udid=
android.app.mentoring.path=src/test/resources/apps/Mentoring.apk
android.app.gamef.path=src/test/resources/apps/GameF.apk
android.app.apidemos.path=src/test/resources/apps/ApiDemos-debug.apk
android.app.apidemos.package=io.appium.android.apis
android.app.apidemos.activity=.ApiDemos

#------------------------------ iOS ----------------------------------------
# ios.device.name=iPhone 16
# ios.platform.version=18.0
# ios.udid=
# ios.app.<key>.path=path/to/App.app
# ios.app.<key>.bundle.id=com.example.App

#------------------------------ APP SESSION --------------------------------
app.no.reset=false
app.full.reset=false

#------------------------------ WAITS (seconds) ----------------------------
wait.implicit=10
wait.explicit=15

#------------------------------ REPORTING ----------------------------------
screenshots.on.success=false

#------------------------------ WEB ----------------------------------------
web.browser=Chrome
web.base.url=https://the-internet.herokuapp.com
# Public demo credentials published on the site itself
web.valid.username=tomsmith
web.valid.password=SuperSecretPassword!

#------------------------------ SAUCE LABS (optional) ----------------------
# Enable with appium.server.mode=remote, appium.server.url=https://ondemand.<region>.saucelabs.com:443/wd/hub
# and SAUCE_USERNAME / SAUCE_ACCESS_KEY env variables (never commit credentials).
