plugins {
    id 'java'
}

group 'apj.framework'
version '1.0-SNAPSHOT'

sourceCompatibility = 1.8

repositories {
    mavenCentral()
}

def suite1 = project.hasProperty("regression")
def suite2 = project.hasProperty("parallelSuite")
def suite3 = project.hasProperty("appRegression")

test {
    useTestNG() {
        options {
            suites 'src/test/java/resources/testng.xml'
            setParallel('tests')
            setThreadCount(2)
        }
        if (project.hasProperty('suite1')) { suites './src/test/resources/suits/gameF.xml' }
        if (project.hasProperty('suite2')) { suites './src/test/resources/suits/parallelSuite.xml' }
        if (project.hasProperty('suite3')) { suites './src/test/resources/suits/appRegression.xml' }
    }
}

dependencies {
    testCompile group: 'junit', name: 'junit', version: '4.12'
    testCompile group: 'io.appium', name: 'java-client', version: '6.1.0'
    testCompile group: 'org.testng', name: 'testng', version: '6.14.3'
    compileOnly 'org.projectlombok:lombok:1.18.6'
    annotationProcessor 'org.projectlombok:lombok:1.18.6'
}
